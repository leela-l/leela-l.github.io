<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nuclear Fission Interactive Simulation</title>
<style>
    body {
        background: #0b0f1a;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    canvas {
        background: #111827;
        border: 2px solid #555;
        margin-top: 10px;
    }
    .controls {
        margin: 15px;
    }
    label {
        display: block;
        margin-top: 8px;
    }
    .legend {
        margin-top: 15px;
        background: #1f2937;
        padding: 10px;
        display: inline-block;
        text-align: left;
        border-radius: 8px;
    }
    .color-box {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-right: 6px;
    }
</style>
</head>
<body>

<h1>Nuclear Fission Chain Reaction</h1>

<div class="controls">
    <label>
        Initial Uranium Atoms: 
        <span id="uraniumValue">20</span>
        <input type="range" id="uraniumSlider" min="1" max="150" value="20">
    </label>

    <label>
        Initial Neutrons: 
        <span id="neutronValue">2</span>
        <input type="range" id="neutronSlider" min="1" max="50" value="2">
    </label>

    <label>
        Temperature (Particle Speed):
        <span id="tempValue">1</span>
        <input type="range" id="tempSlider" min="0.5" max="3" step="0.1" value="1">
    </label>

    <button onclick="startSimulation()">Start</button>
    <button onclick="resetSimulation()">Reset</button>
</div>

<canvas id="canvas" width="900" height="500"></canvas>

<div class="legend">
    <strong>Legend:</strong><br>
    <div><span class="color-box" style="background:#22c55e"></span>Uranium Atom (U-235)</div>
    <div><span class="color-box" style="background:#3b82f6"></span>Neutron</div>
    <div><span class="color-box" style="background:#ef4444"></span>Fission Fragments (Smaller Atoms)</div>
    <div><span class="color-box" style="background:yellow"></span>Energy Released</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let uraniumAtoms = [];
let neutrons = [];
let fragments = [];
let energyBursts = [];
let animationId;
let temperature = 1;

const uraniumSlider = document.getElementById("uraniumSlider");
const neutronSlider = document.getElementById("neutronSlider");
const tempSlider = document.getElementById("tempSlider");

uraniumSlider.oninput = () => {
    document.getElementById("uraniumValue").innerText = uraniumSlider.value;
};

neutronSlider.oninput = () => {
    document.getElementById("neutronValue").innerText = neutronSlider.value;
};

tempSlider.oninput = () => {
    temperature = parseFloat(tempSlider.value);
    document.getElementById("tempValue").innerText = tempSlider.value;
};

class Particle {
    constructor(x, y, radius, speedMultiplier) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.speedMultiplier = speedMultiplier;
        this.vx = (Math.random() - 0.5) * speedMultiplier;
        this.vy = (Math.random() - 0.5) * speedMultiplier;
    }

    move() {
        this.x += this.vx * temperature;
        this.y += this.vy * temperature;

        if (this.x < this.radius || this.x > canvas.width - this.radius) this.vx *= -1;
        if (this.y < this.radius || this.y > canvas.height - this.radius) this.vy *= -1;
    }
}

class Uranium extends Particle {
    constructor(x, y) {
        super(x, y, 12, 1);
        this.split = false;
    }
    draw() {
        if (!this.split) {
            ctx.fillStyle = "#22c55e";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

class Neutron extends Particle {
    constructor(x, y) {
        super(x, y, 4, 3);
    }
    draw() {
        ctx.fillStyle = "#3b82f6";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Fragment extends Particle {
    constructor(x, y) {
        super(x, y, 6, 2);
    }
    draw() {
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Energy {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.life = 25;
    }
    update() {
        this.radius += 1.5;
        this.life--;
    }
    draw() {
        ctx.strokeStyle = "yellow";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function startSimulation() {
    resetSimulation();

    for (let i = 0; i < uraniumSlider.value; i++) {
        uraniumAtoms.push(new Uranium(
            Math.random() * canvas.width,
            Math.random() * canvas.height
        ));
    }

    for (let i = 0; i < neutronSlider.value; i++) {
        neutrons.push(new Neutron(
            Math.random() * canvas.width,
            Math.random() * canvas.height
        ));
    }

    animate();
}

function resetSimulation() {
    cancelAnimationFrame(animationId);
    uraniumAtoms = [];
    neutrons = [];
    fragments = [];
    energyBursts = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    uraniumAtoms.forEach(u => {
        u.move();
        u.draw();
    });

    neutrons.forEach(n => {
        n.move();
        n.draw();

        uraniumAtoms.forEach(u => {
            if (!u.split) {
                let dx = n.x - u.x;
                let dy = n.y - u.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < u.radius + n.radius) {
                    u.split = true;

                    fragments.push(new Fragment(u.x, u.y));
                    fragments.push(new Fragment(u.x, u.y));
                    energyBursts.push(new Energy(u.x, u.y));

                    let newNeutrons = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < newNeutrons; i++) {
                        neutrons.push(new Neutron(u.x, u.y));
                    }
                }
            }
        });
    });

    fragments.forEach(f => {
        f.move();
        f.draw();
    });

    energyBursts = energyBursts.filter(e => e.life > 0);
    energyBursts.forEach(e => {
        e.update();
        e.draw();
    });

    animationId = requestAnimationFrame(animate);
}
</script>

</body>
