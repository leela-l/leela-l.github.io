<section class="feature qft-interactive" style="margin-top:40px;margin-bottom:40px;">

  <h2 style="color:#333;text-align:left;">Interactive Quantum Field: Energy Levels & Vacuum Fluctuations</h2>

  <div class="qft-container" style="
      display:flex;
      align-items:center;
      gap:30px;
      max-width:900px;
      margin:0 auto;
  ">

    <!-- Energy Bar -->
    <div class="energy-bar" style="display:flex;flex-direction:column-reverse;gap:8px;">
      <div class="energy-level" data-level="4" style="width:25px;height:40px;border:2px solid #e68e73;border-radius:4px;transition:background .3s;"></div>
      <div class="energy-level" data-level="3" style="width:25px;height:40px;border:2px solid #e68e73;border-radius:4px;transition:background .3s;"></div>
      <div class="energy-level" data-level="2" style="width:25px;height:40px;border:2px solid #e68e73;border-radius:4px;transition:background .3s;"></div>
      <div class="energy-level" data-level="1" style="width:25px;height:40px;border:2px solid #e68e73;border-radius:4px;transition:background .3s;"></div>
    </div>

    <!-- Canvas -->
    <canvas id="qftCanvas" width="500" height="250" style="
        width:500px;
        height:250px;
        border:1px solid #ccc;
        background:#fafafa;
        border-radius:6px;
    "></canvas>

    <!-- Controls -->
    <div class="qft-controls" style="display:flex;flex-direction:column;gap:10px;">
      <button id="raiseBtn" style="
          padding:8px 12px;
          border:none;
          background:#e68e73;
          color:white;
          border-radius:4px;
          cursor:pointer;
          font-size:0.9rem;
      ">Add Energy (a†)</button>

      <button id="lowerBtn" style="
          padding:8px 12px;
          border:none;
          background:#e68e73;
          color:white;
          border-radius:4px;
          cursor:pointer;
          font-size:0.9rem;
      ">Remove Energy (a)</button>
    </div>

  </div>
</section>

<script>
const canvas = document.getElementById("qftCanvas");
const ctx = canvas.getContext("2d");

let energyLevel = 0;
const maxLevel = 4;

function updateEnergyBar() {
  document.querySelectorAll(".energy-level").forEach(level => {
    const n = parseInt(level.dataset.level);
    if (n <= energyLevel) {
      level.style.background = "#e68e73";
    } else {
      level.style.background = "transparent";
    }
  });
}

updateEnergyBar();

document.getElementById("raiseBtn").onclick = () => {
  if (energyLevel < maxLevel) energyLevel++;
  updateEnergyBar();
};

document.getElementById("lowerBtn").onclick = () => {
  if (energyLevel > 0) energyLevel--;
  updateEnergyBar();
};

let t = 0;

function randomVacuumFluctuation() {
  return Math.random() < 0.005 ? (Math.random() - 0.5) * 40 : 0;
}

function drawField() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const amplitude = 10 + energyLevel * 8;
  const wavelength = 60;
  const baseline = canvas.height / 2;

  ctx.beginPath();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#e68e73";

  for (let x = 0; x < canvas.width; x++) {
    const y =
      baseline +
      amplitude * Math.sin((x / wavelength) + t) +
      randomVacuumFluctuation();

    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
  t += 0.03;
  requestAnimationFrame(drawField);
}

drawField();
</script>
