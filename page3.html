<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physics Mythbusters | Quantum Fields</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

<style>
  body { background-color:#1f2235; color:#fff; font-family:sans-serif; }
  #qft-container { position: relative; width: 100%; height: 450px; margin-top:20px; background:#1f2235; }
  #overlay {
    position: absolute; top: 10px; right: 10px; z-index:10;
    background: rgba(0,0,0,0.6); padding:10px; border-radius:8px; color:#fff;
    display:flex; flex-direction: column; align-items:center;
  }
  #overlay button { margin: 2px; font-size:0.85rem; width:140px; }
  #energy-meter { display:flex; flex-direction: column-reverse; align-items:center; margin-top:10px; }
  .level { width: 20px; height: 30px; margin:2px; border:1px solid #fff; display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:#fff; }
  .active { background: #ffcc00; color:#111; font-weight:bold; }
</style>
</head>
<body>

<section class="feature">
  <h2>Quantum Fields Interactive Demo</h2>
  <p>Visualize a quantum field plane with energy levels, ladder operators, and virtual particle fluctuations.</p>

  <div id="qft-container">
    <div id="overlay">
      <button id="addEnergy">Increase Energy</button>
      <button id="removeEnergy">Decrease Energy</button>
      <button id="createVirtual">Create Virtual Particle</button>

      <div id="energy-meter"></div>
    </div>
  </div>
</section>

<script>
  // -----------------------------
  // Three.js Scene
  // -----------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1f2235);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/450, 0.1, 1000);
  camera.position.set(0, 12, 18);
  camera.lookAt(0,0,0);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(window.innerWidth,450);
  document.getElementById('qft-container').appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff,0.5));
  const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
  dirLight.position.set(5,10,7.5);
  scene.add(dirLight);

  // Plane (quantum field)
  const planeSize = 16;
  const segments = 40;
  const geometry = new THREE.PlaneGeometry(planeSize, planeSize, segments, segments);
  geometry.rotateX(-Math.PI/2);
  const material = new THREE.MeshPhongMaterial({color:0x3399ff, side:THREE.DoubleSide, flatShading:true});
  const plane = new THREE.Mesh(geometry, material);
  scene.add(plane);

  // -----------------------------
  // Virtual fuzzy particles
  // -----------------------------
  const particleGeometry = new THREE.BufferGeometry();
  const particleCount = 100;
  const positions = new Float32Array(particleCount*3);
  particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions,3));

  const particleMaterial = new THREE.PointsMaterial({
    color:0xffdd00,
    size:0.5,
    transparent:true,
    opacity:0.8,
    map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png'),
    blending: THREE.AdditiveBlending,
    depthWrite:false
  });

  const particles = new THREE.Points(particleGeometry, particleMaterial);
  scene.add(particles);

  let virtualParticles = [];

  // -----------------------------
  // Energy levels / ladder operators
  // -----------------------------
  let energyLevel = 0;
  const maxLevel = 5;
  const meter = document.getElementById('energy-meter');

  function updateMeter(){
    meter.innerHTML = '';
    for(let n=maxLevel; n>=0; n--){
      const div = document.createElement('div');
      div.className = 'level';
      if(n===energyLevel) div.classList.add('active');
      div.innerHTML = `|${n}⟩<br>↑a†↓a`;
      meter.appendChild(div);
    }
  }
  updateMeter();

  // -----------------------------
  // Plane animation
  // -----------------------------
  let time=0;
  const waveAmplitude = 0.6;
  const waveSpeed = 0.5;

  function animate(){
    requestAnimationFrame(animate);
    time+=0.02;

    // Plane fluctuation
    for(let i=0;i<geometry.attributes.position.count;i++){
      const x = geometry.attributes.position.getX(i);
      const z = geometry.attributes.position.getZ(i);
      const y = Math.sin((x + time*waveSpeed))*Math.cos((z + time*waveSpeed))*waveAmplitude*(1 + energyLevel*0.15);
      geometry.attributes.position.setY(i,y);
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();

    // Virtual particles animation
    virtualParticles.forEach((vp,i)=>{
      vp.life -= 0.02;
      vp.mesh.position.y += 0.02;
      vp.mesh.material.opacity = vp.life;
      if(vp.life<=0){
        scene.remove(vp.mesh);
        virtualParticles.splice(i,1);
      }
    });

    renderer.render(scene,camera);
  }
  animate();

  // -----------------------------
  // Buttons
  // -----------------------------
  document.getElementById('addEnergy').addEventListener('click',()=>{
    if(energyLevel < maxLevel) energyLevel++;
    updateMeter();
  });
  document.getElementById('removeEnergy').addEventListener('click',()=>{
    if(energyLevel > 0) energyLevel--;
    updateMeter();
  });
  document.getElementById('createVirtual').addEventListener('click',()=>{
    const vpGeo = new THREE.SphereGeometry(0.4,16,16);
    const vpMat = new THREE.MeshBasicMaterial({color:0xffdd00, transparent:true, opacity:0.8});
    const vpMesh = new THREE.Mesh(vpGeo,vpMat);
    vpMesh.position.set((Math.random()-0.5)*planeSize,0.5,(Math.random()-0.5)*planeSize);
    scene.add(vpMesh);
    virtualParticles.push({mesh: vpMesh, life:1});
  });

  // -----------------------------
  // Resize
  // -----------------------------
  window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/450;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,450);
  });
</script>

</body>
</html>
