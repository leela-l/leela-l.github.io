<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics Mythbusters | The Quantum World</title>
  <link rel="stylesheet" href="style.css">

  <!-- Three.js library -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

  <style>
    /* QFT container styling */
    #qft-container { position: relative; width: 100%; height: 400px; margin-top: 20px; background-color: #111; }
    #overlay {
      position: absolute; top: 10px; left: 10px; z-index:10;
      background: rgba(0,0,0,0.6); padding: 10px; border-radius:8px; color: #fff;
      font-family: sans-serif;
    }
    #overlay button { margin: 2px; font-size: 0.9rem; }
    #ladder ul { margin:0; padding-left: 20px; }
    canvas { display: block; pointer-events: none; }
  </style>
</head>
<body style="background-color: #1f2235; color: #fff; font-family: sans-serif;">

<header>
  <h1>Physics Mythbusters</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="page1.html">Climate Change</a>
    <a href="page2.html">Nuclear Energy</a>
    <a href="page3.html">The Quantum World</a>
    <a href="page4.html">Cellular Technology</a>
    <a href="page5.html">Astronomy</a>
  </nav>
</header>

<section class="feature">
  <h2>Quantum Fields Interactive Demo</h2>
  <p>This demo visualizes a quantum field plane, energy levels with ladder operators, and particle pair creation/annihilation.</p>

  <div id="qft-container">
    <div id="overlay">
      <div>
        <button id="addEnergy">Add Energy</button>
        <button id="removeEnergy">Remove Energy</button>
        <button id="createPair">Create Particle Pair</button>
        <button id="annihilatePair">Annihilate Particle Pair</button>
      </div>
      <div id="ladder">
        <p>Ladder Operators / Energy Levels:</p>
        <ul id="levels"></ul>
      </div>
    </div>
  </div>
</section>

<script>
  // -----------------------------
  // Scene setup
  // -----------------------------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1f2235); // match page background

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 12, 18);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, 400);
  document.getElementById('qft-container').appendChild(renderer.domElement);

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff,0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
  dirLight.position.set(5,10,7.5);
  scene.add(dirLight);

  // -----------------------------
  // Plane representing the field
  // -----------------------------
  const planeSize = 16;
  const segments = 40;
  const geometry = new THREE.PlaneGeometry(planeSize, planeSize, segments, segments);
  geometry.rotateX(-Math.PI/2);
  const material = new THREE.MeshPhongMaterial({color:0x3399ff, side:THREE.DoubleSide, flatShading:true});
  const plane = new THREE.Mesh(geometry, material);
  scene.add(plane);

  // -----------------------------
  // Particles
  // -----------------------------
  const particleGeometry = new THREE.SphereGeometry(0.4,16,16);
  const particleMaterial = new THREE.MeshBasicMaterial({color:0xffdd00});
  let particles = [];

  // -----------------------------
  // Ladder operators / energy levels
  // -----------------------------
  let energyLevel = 0;
  const maxLevel = 5; // cap at 5 levels
  const levelsList = document.getElementById('levels');
  function updateLevels(){
    levelsList.innerHTML = '';
    for(let n=0;n<=energyLevel;n++){
      const li = document.createElement('li');
      li.textContent = `|${n}⟩  →  a†|${n}⟩ = |${Math.min(n+1,maxLevel)}⟩,  a|${n}⟩ = |${Math.max(n-1,0)}⟩`;
      levelsList.appendChild(li);
    }
  }
  updateLevels();

  // -----------------------------
  // Plane fluctuation animation
  // -----------------------------
  let time = 0;
  const waveAmplitude = 0.6;
  const waveSpeed = 0.5;
  function animate(){
    requestAnimationFrame(animate);
    time += 0.02;

    for(let i=0;i<geometry.attributes.position.count;i++){
      const x = geometry.attributes.position.getX(i);
      const z = geometry.attributes.position.getZ(i);
      const y = Math.sin((x + time*waveSpeed))*Math.cos((z + time*waveSpeed)) * waveAmplitude * (1 + energyLevel*0.15);
      geometry.attributes.position.setY(i,y);
    }

    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();
    renderer.render(scene,camera);
  }
  animate();

  // -----------------------------
  // Buttons
  // -----------------------------
  document.getElementById('addEnergy').addEventListener('click',()=>{
    if(energyLevel < maxLevel) energyLevel++;
    updateLevels();
  });
  document.getElementById('removeEnergy').addEventListener('click',()=>{
    if(energyLevel > 0) energyLevel--;
    updateLevels();
  });
  document.getElementById('createPair').addEventListener('click',()=>{
    const p = new THREE.Mesh(particleGeometry,particleMaterial);
    p.position.set((Math.random()-0.5)*planeSize,1,(Math.random()-0.5)*planeSize);
    scene.add(p);
    particles.push(p);
  });
  document.getElementById('annihilatePair').addEventListener('click',()=>{
    if(particles.length>0){
      const p = particles.pop();
      scene.remove(p);
    }
  });

  // -----------------------------
  // Resize handling
  // -----------------------------
  window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/400;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,400);
  });
</script>

</body>
</html>
